# CPU Triton in the same cluster. Proves mode selects the CPU values file.
cluster:
  ingressClassName: nginx
  customRootCA: false

services:
  triton:
    mode: cpu
  synaplan:
    url: https://synaplan.example.org
    oidc:
      issuerURI: https://id.example.org/realms/opendesk
      clientId: synaplan
