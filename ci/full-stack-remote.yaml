# Remote inference, no Triton release. Shape used by a CPU cluster that
# points Synaplan at an Ollama it already runs (the Vultr install).
cluster:
  ingressClassName: nginx
  customRootCA: false

services:
  triton:
    mode: remote
  synaplan:
    url: https://synaplan.example.org
    oidc:
      issuerURI: https://id.example.org/realms/opendesk
      clientId: synaplan
    ollama:
      baseUrl: http://ollama.example.svc.cluster.local:11434
