# Minimal values for linting the synaplan chart. These are the chart's own
# fields. Repeating them under env fails the render: the chart already emits
# APP_URL and DB_*.
persistence:
  enabled: true

image:
  repository: ghcr.io/metadist/synaplan
  tag: latest

publicUrl: http://localhost

database:
  host: mariadb
  name: synaplan
  user: synaplan
  password: password
