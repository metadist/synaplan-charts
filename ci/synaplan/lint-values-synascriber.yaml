# Lint values for the synaplan chart with meeting notes (synaScriber) on.
persistence:
  uploads:
    enabled: true
appSecret: lint
database:
  password: lint
publicUrl: https://synaplan.opendesk.example
synascriber:
  enabled: true
  secrets:
    prosodySecret: lint-prosody-secret
    transcriberToken: lint-transcriber-token
    transcriberSecret: lint-transcriber-secret
  registration:
    settings:
      sttUrl: http://synaplan-stt:8080
      prosodyUrl: http://jitsi-prosody:5280
      jitsiUrl: https://meet.opendesk.example
