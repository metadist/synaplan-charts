<!-- synaScriber 0.3.0, jitsi/static/synascriber-silent.html: the Jitsi button's silent Keycloak sign-in page. Served by Jitsi web through web.extraFiles (see synascriber-jitsi.yaml.gotmpl); the openDesk chart's own web volumes cannot be extended, only replaced. Keep in step with images.synascriber. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meeting notes sign-in</title>
  </head>
  <body>
    <script>
      // Keycloak redirects here (silent iframe or popup). Hand the code back to
      // the synaScriber loader on the same origin, then go away.
      (function () {
        var message = { type: 'synascriber-auth', search: window.location.search }
        var target = window.opener || (window.parent !== window ? window.parent : null)
        if (target) {
          target.postMessage(message, window.location.origin)
        }
        if (window.opener) {
          window.close()
        }
      })()
    </script>
  </body>
</html>
