suite: env
templates:
  - deployment.yaml
  - init-scripts-configmap.yaml
set:
  appSecret: test
  database:
    password: test
tests:
  - it: emits each URL of a neighbour service once
    template: deployment.yaml
    set:
      qdrant:
        url: http://qdrant:6333
      office:
        convertUrl: http://collabora:9980
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QDRANT_URL
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_CONVERT_URL
          any: true
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_PUBLIC_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_WOPI_URL
          any: true

  - it: emits the editor URLs only as a pair
    template: deployment.yaml
    set:
      office:
        publicUrl: https://office.example.org
        wopiUrl: http://synaplan:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_PUBLIC_URL
            value: https://office.example.org
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_WOPI_URL
            value: http://synaplan:80
          count: 1

  - it: leaves the vectors of uploaded files in MariaDB
    template: deployment.yaml
    set:
      qdrant:
        url: http://qdrant:6333
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VECTOR_STORAGE_PROVIDER
          any: true

  - it: moves the vectors of uploaded files to Qdrant
    template: deployment.yaml
    set:
      qdrant:
        url: http://qdrant:6333
        documentVectors: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VECTOR_STORAGE_PROVIDER
            value: qdrant
          count: 1

  - it: sends the Qdrant API key from a Secret
    template: deployment.yaml
    set:
      image:
        tag: "5.11.0"
      qdrant:
        url: http://qdrant:6333
        apiKeySecretRef: qdrant-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: qdrant-credentials
                key: qdrant-api-key
          count: 1

  - it: leaves the Qdrant API key unset when no Secret is named
    template: deployment.yaml
    set:
      qdrant:
        url: http://qdrant:6333
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: QDRANT_API_KEY
          any: true

  - it: refuses a Qdrant API key without the Qdrant URL
    template: deployment.yaml
    set:
      image:
        tag: "5.11.0"
      qdrant:
        apiKeySecretRef: qdrant-credentials
    asserts:
      - failedTemplate:
          errorPattern: "qdrant.apiKeySecretRef is set without qdrant.url"

  - it: refuses a Qdrant API key on an image that does not send one
    template: deployment.yaml
    set:
      image:
        tag: "5.10.1"
      qdrant:
        url: http://qdrant:6333
        apiKeySecretRef: qdrant-credentials
    asserts:
      - failedTemplate:
          errorPattern: "qdrant.apiKeySecretRef needs synaplan >= 5.11.0"

  - it: refuses a Qdrant API key written into env
    template: deployment.yaml
    set:
      env:
        - name: QDRANT_API_KEY
          value: secret
    asserts:
      - failedTemplate:
          errorPattern: "env sets QDRANT_API_KEY"

  - it: refuses document vectors in Qdrant without its URL
    template: deployment.yaml
    set:
      qdrant:
        documentVectors: true
    asserts:
      - failedTemplate:
          errorPattern: "qdrant.documentVectors is set without qdrant.url"

  - it: refuses a public editor URL without the callback URL
    template: deployment.yaml
    set:
      office:
        publicUrl: https://office.example.org
    asserts:
      - failedTemplate:
          errorPattern: "office.publicUrl is set without office.wopiUrl"

  - it: refuses a name that a chart value already emits
    template: deployment.yaml
    set:
      qdrant:
        url: http://qdrant:6333
      env:
        - name: QDRANT_URL
          value: http://qdrant:6333
    asserts:
      - failedTemplate:
          errorPattern: "env sets QDRANT_URL"

  - it: passes any other name through
    template: deployment.yaml
    set:
      env:
        - name: MY_SETTING
          value: "1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_SETTING
            value: "1"

  - it: sets TIKA_BASE_URL empty when Tika is off
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIKA_BASE_URL
            value: ""

  - it: sets TIKA_BASE_URL to tika.url when Tika is on
    template: deployment.yaml
    set:
      tika:
        enabled: true
        url: http://tika:9998
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIKA_BASE_URL
            value: http://tika:9998

  - it: refuses TIKA_BASE_URL in env
    template: deployment.yaml
    set:
      env:
        - name: TIKA_BASE_URL
          value: http://tika:9998
    asserts:
      - failedTemplate:
          errorPattern: "env sets TIKA_BASE_URL"

  - it: pins FEATURE_FREEAPI_ENABLED to false by default
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_FREEAPI_ENABLED
            value: "false"
          count: 1

  - it: lets an evaluation cluster enable features.freeApi
    template: deployment.yaml
    set:
      features:
        freeApi: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_FREEAPI_ENABLED
            value: "true"
          count: 1

