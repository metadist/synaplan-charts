suite: env
templates:
  - deployment.yaml
  - init-scripts-configmap.yaml
set:
  appSecret: test
  database:
    password: test
tests:
  - it: emits each URL of a neighbour service once
    template: deployment.yaml
    set:
      qdrant:
        url: http://qdrant:6333
      office:
        convertUrl: http://collabora:9980
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QDRANT_URL
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_CONVERT_URL
          any: true
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_PUBLIC_URL

  - it: emits the editor URLs only as a pair
    template: deployment.yaml
    set:
      office:
        publicUrl: https://office.example.org
        wopiUrl: http://synaplan:80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_PUBLIC_URL
            value: https://office.example.org
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_WOPI_URL
            value: http://synaplan:80
          count: 1

  - it: refuses a public editor URL without the callback URL
    template: deployment.yaml
    set:
      office:
        publicUrl: https://office.example.org
    asserts:
      - failedTemplate:
          errorPattern: "office.publicUrl is set without office.wopiUrl"

  - it: refuses a name that a chart value already emits
    template: deployment.yaml
    set:
      qdrant:
        url: http://qdrant:6333
      env:
        - name: QDRANT_URL
          value: http://qdrant:6333
    asserts:
      - failedTemplate:
          errorPattern: "env sets QDRANT_URL"

  - it: passes any other name through
    template: deployment.yaml
    set:
      env:
        - name: MY_SETTING
          value: "1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_SETTING
            value: "1"

  - it: sets TIKA_BASE_URL empty when Tika is off
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIKA_BASE_URL
            value: ""

  - it: sets TIKA_BASE_URL to tika.url when Tika is on
    template: deployment.yaml
    set:
      tika:
        enabled: true
        url: http://tika:9998
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIKA_BASE_URL
            value: http://tika:9998

  - it: refuses TIKA_BASE_URL in env
    template: deployment.yaml
    set:
      env:
        - name: TIKA_BASE_URL
          value: http://tika:9998
    asserts:
      - failedTemplate:
          errorPattern: "env sets TIKA_BASE_URL"

  - it: pins FEATURE_FREEAPI_ENABLED to false by default
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_FREEAPI_ENABLED
            value: "false"
          count: 1

  - it: lets an evaluation cluster enable features.freeApi
    template: deployment.yaml
    set:
      features:
        freeApi: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FEATURE_FREEAPI_ENABLED
            value: "true"
          count: 1

