suite: credentials
templates:
  - credentials-secret.yaml
  - deployment.yaml
  - init-scripts-configmap.yaml
tests:
  - it: writes the given values
    template: credentials-secret.yaml
    set:
      appSecret: app
      database:
        password: db
      oidc:
        enabled: true
        clientSecret: oidc
    asserts:
      - equal:
          path: stringData
          value:
            app-secret: app
            password: db
            client-secret: oidc

  - it: keeps a value that is already in the Secret
    template: credentials-secret.yaml
    set:
      database:
        password: db
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-synaplan-credentials
            namespace: NAMESPACE
          data:
            app-secret: a2VwdA==
    asserts:
      - equal:
          path: stringData.app-secret
          value: kept

  - it: fails without a value and without the Secret
    template: deployment.yaml
    set:
      database:
        password: db
    asserts:
      - failedTemplate:
          errorPattern: "appSecret is empty and the Secret RELEASE-NAME-synaplan-credentials has no key app-secret yet"

  - it: reads the values from that Secret, not from the pod spec
    template: deployment.yaml
    set:
      appSecret: app
      database:
        password: db
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: APP_SECRET
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-synaplan-credentials
                key: app-secret

  - it: leaves a value out that comes from a SecretRef
    template: credentials-secret.yaml
    set:
      appSecretRef: existing
      database:
        passwordSecretRef: existing
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps a database root password for a database next to Synaplan
    template: credentials-secret.yaml
    set:
      appSecret: app
      database:
        password: db
        rootPassword: root
    asserts:
      - equal:
          path: stringData.database-root-password
          value: root

  - it: leaves the database root password out when there is none
    template: credentials-secret.yaml
    set:
      appSecret: app
      database:
        password: db
    asserts:
      - notExists:
          path: stringData.database-root-password

  - it: keeps the database root password once it is in the Secret
    template: credentials-secret.yaml
    set:
      appSecret: app
      database:
        password: db
        rootPassword: new
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-synaplan-credentials
            namespace: NAMESPACE
          data:
            database-root-password: b2xk
    asserts:
      - equal:
          path: stringData.database-root-password
          value: old

  - it: keeps the first administrator's password and reads it from the Secret
    templates:
      - credentials-secret.yaml
      - deployment.yaml
    set:
      appSecret: app
      database:
        password: db
      bootstrapAdmin:
        email: admin@example.org
        password: admin-password
    asserts:
      - equal:
          path: stringData.admin-password
          value: admin-password
        template: credentials-secret.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BOOTSTRAP_ADMIN_EMAIL
            value: admin@example.org
        template: deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-synaplan-credentials
                key: admin-password
        template: deployment.yaml

  - it: keeps the first administrator's password once it is in the Secret
    template: credentials-secret.yaml
    set:
      appSecret: app
      database:
        password: db
      bootstrapAdmin:
        email: admin@example.org
        password: new
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-synaplan-credentials
            namespace: NAMESPACE
          data:
            admin-password: b2xk
    asserts:
      - equal:
          path: stringData.admin-password
          value: old

  - it: fails without a first administrator's password
    template: deployment.yaml
    set:
      appSecret: app
      database:
        password: db
      bootstrapAdmin:
        email: admin@example.org
    asserts:
      - failedTemplate:
          errorMessage: "bootstrapAdmin.password is empty and the Secret RELEASE-NAME-synaplan-credentials has no key admin-password yet"
