suite: oidc access policy
templates:
  - deployment.yaml
  - init-scripts-configmap.yaml
set:
  appSecret: test
  database:
    password: test
  oidc:
    enabled: true
    issuerURI: https://id.example.org/realms/test
    clientId: synaplan
    clientSecret: test
tests:
  - it: emits the access policy
    template: deployment.yaml
    set:
      oidc.accessPolicy:
        orgCode: org_1
        requiredRole: admin,editor
        requiredPermissions: read
        allowUserProvisioning: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ORG_CODE
            value: org_1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REQUIRED_ROLE
            value: admin,editor
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REQUIRED_PERMISSIONS
            value: read
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ALLOW_USER_PROVISIONING
            value: "false"

  - it: emits nothing without a policy
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ALLOW_USER_PROVISIONING
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ORG_CODE
          any: true

  - it: refuses a Synaplan older than 5.3.1
    template: deployment.yaml
    set:
      image.tag: 5.3.0
      oidc.accessPolicy.orgCode: org_1
    asserts:
      - failedTemplate:
          errorPattern: "5\\.3\\.1"

  - it: renders on Synaplan 5.3.1
    template: deployment.yaml
    set:
      image.tag: 5.3.1
      oidc.accessPolicy.orgCode: org_1
    asserts:
      - notFailedTemplate: {}

  - it: refuses a policy value that is not a string
    template: deployment.yaml
    set:
      oidc.accessPolicy.requiredRole: 0
    asserts:
      - failedTemplate:
          errorPattern: "requiredRole must be a string"

  - it: refuses allowUserProvisioning that is not a boolean
    template: deployment.yaml
    set:
      oidc.accessPolicy.allowUserProvisioning: "no"
    asserts:
      - failedTemplate:
          errorPattern: "allowUserProvisioning must be true, false or null"
