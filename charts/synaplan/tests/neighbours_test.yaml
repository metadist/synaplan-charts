suite: neighbour URLs
templates:
  - deployment.yaml
  - init-scripts-configmap.yaml
tests:
  - it: renders with the chart defaults
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment

  - it: emits each neighbour URL once
    template: deployment.yaml
    set:
      qdrant.url: http://qdrant.synaplan.svc.cluster.local:6333
      office.convertUrl: http://collabora-online.opendesk.svc.cluster.local:9980
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QDRANT_URL
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OFFICE_CONVERT_URL
          any: true
          count: 1
