customRootCA: false

# Public URL for accessing Synaplan (e.g., https://synaplan.example.com)
publicUrl: ""

# -- Triton deployment mode (cpu or gpu) - determines which model to register in database
tritonMode: "gpu"

# Mailer configuration (Symfony mailer DSN)
# Examples: smtp://user:pass@smtp.example.com:587, null://null (disabled)
mailerDsn: "null://null"

# AI Provider API Keys (optional - leave empty to disable)
# Option 1: Plain text values (not recommended for production)
apiKeys:
  anthropic: ""
  openai: ""
  groq: ""
  googleGemini: ""
  braveSearch: ""
  huggingface: ""

# Option 2: Reference existing secrets (recommended for production)
# Create secret: kubectl create secret generic synaplan-api-keys \
#   --from-literal=anthropic-api-key=YOUR_KEY \
#   --from-literal=openai-api-key=YOUR_KEY \
#   --from-literal=groq-api-key=YOUR_KEY \
#   --from-literal=google-gemini-api-key=YOUR_KEY \
#   --from-literal=brave-search-api-key=YOUR_KEY \
#   --from-literal=huggingface-api-key=YOUR_KEY
# Then set: apiKeysSecretRef: "synaplan-api-keys"
apiKeysSecretRef: ""

# Database configuration
database:
  host: "mariadb-cluster"
  port: "3306"
  name: "synaplan"
  user: "synaplan"
  serverVersion: "11.7.2-MariaDB"

# Triton Inference Server configuration
triton:
  # -- Triton gRPC endpoint URL. Leave empty to disable Triton backend.
  url: "triton:8001"

# Ollama configuration — recommended alternative to Triton
ollama:
  # -- Ollama API base URL. Set this to use Ollama for LLM inference and bge-m3 embedding.
  # Example: http://ollama.synaplan.svc.cluster.local:11434
  baseUrl: ""

# Tika document processing service configuration
tika:
  enabled: false
  url: "http://tika.synaplan.svc.cluster.local:9998"

# Redis — shared infrastructure for the realtime release (Synaplan >= 2.5):
# Symfony cache, sessions, locks, rate-limiter, Messenger queues (Redis
# Streams) and the Centrifugo realtime engine. Mandatory once the app image
# requires it; keep disabled while running 2.4.x images.
redis:
  # -- Deploy an in-cluster Redis (single instance, cache semantics, no persistence)
  enabled: false
  # -- Use an external/managed Redis instead of the in-cluster one (e.g. redis://redis.internal:6379). Ignored when redis.enabled is true.
  externalDsn: ""
  image:
    repository: redis
    # Pinned to 7.4: Centrifugo v6 reliably receives pub/sub publications from
    # Redis 7.x, while 8.x dropped fan-out to the Centrifugo node.
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  # -- Redis maxmemory (LRU eviction via allkeys-lru)
  maxMemory: "256mb"
  resources: {}

# Centrifugo — WebSocket realtime gateway (live chat takeover, typing
# indicators, operator notifications). Requires Redis (engine) and an app
# image >= 2.5. Browsers connect same-origin via /connection/websocket —
# the app's built-in Caddy proxies that path to the service named
# "centrifugo" (fixed name, expected by the Caddyfile baked into the app
# image; one release per namespace).
centrifugo:
  enabled: false
  image:
    repository: centrifugo/centrifugo
    tag: "v6.4.0"
    pullPolicy: IfNotPresent
  port: 8000
  replicaCount: 1
  # Secrets — Option 1: plain values (not recommended for production).
  # The backend refuses to mint tokens in prod while these keep the
  # changeme_* placeholders, so realtime stays silently off until set.
  apiKey: "changeme_centrifugo_api_key"
  tokenHmacSecret: "changeme_centrifugo_token_secret"
  adminPassword: "changeme_admin"
  adminSecret: "changeme_admin_secret"
  # Option 2: reference an existing secret (recommended). Expected keys:
  # api-key, token-hmac-secret-key, admin-password, admin-secret.
  # kubectl create secret generic synaplan-realtime \
  #   --from-literal=api-key=$(openssl rand -hex 32) \
  #   --from-literal=token-hmac-secret-key=$(openssl rand -hex 32) \
  #   --from-literal=admin-password=$(openssl rand -hex 16) \
  #   --from-literal=admin-secret=$(openssl rand -hex 32)
  # Then set: secretRef: "synaplan-realtime"
  secretRef: ""
  # -- Origins allowed to open WebSocket connections. Set to your real origin(s) in production, e.g. "https://synaplan.example.com".
  allowedOrigins: "*"
  # -- Public WebSocket URL for browsers. Empty = same-origin via /connection/websocket (recommended).
  publicWsUrl: ""
  # -- Redis address for the Centrifugo engine. Empty = shared chart Redis on logical DB /3.
  redisAddress: ""
  resources: {}

# Symfony Messenger worker — consumes the async Redis Streams queues
# (AI processing, document extraction, indexing). Requires Redis and an app
# image >= 2.5; without a worker, queued jobs never execute.
worker:
  enabled: false
  replicaCount: 1
  # -- Transports to consume (space-separated)
  transports: "async_ai_high async_extract async_index"
  # -- Restart the consumer after this many seconds (bounds memory growth; standard Symfony pattern)
  timeLimit: "3600"
  # -- Restart the consumer when it exceeds this memory limit
  memoryLimit: "512M"
  resources: {}

# OIDC authentication configuration
oidc:
  enabled: false
  issuerURI: ""
  clientId: ""
  # OIDC client secret
  # Option 1: Plain text (not recommended for production)
  clientSecret: ""
  # Option 2: Reference to existing secret (recommended)
  # Create secret: kubectl create secret generic synaplan-oidc-credentials --from-literal=client-secret=YOUR_SECRET
  # Then set: clientSecretRef: "synaplan-oidc-credentials"
  clientSecretRef: ""
  # -- Auto-redirect to OIDC provider on login page
  autoRedirect: true
  # -- Space-separated OIDC scopes requested during login.
  # Remove offline_access if your provider doesn't support it (internal app tokens provide a 7-day fallback).
  scopes: "openid email profile offline_access"

# Seed built-in system prompts on startup (idempotent)
prompts:
  seed: true

# AI models to enable/disable from the built-in catalog on startup
# Keys use the format "service:providerId" (e.g. "groq:llama-3.3-70b-versatile")
# Entries can be strings or objects with a "system" flag to lock the model:
#   enabled:
#     - "groq:llama-3.3-70b-versatile"
#     - name: "ollama:bge-m3"
#       system: true
models:
  enabled: []
  disabled: []
  # Default model per capability. Empty string = skip (no default set).
  # Keys use the same format as enable/disable (e.g. "groq:llama-3.3-70b-versatile")
  defaults:
    chat: ""
    tools: ""
    sort: ""
    summarize: ""
    text2pic: ""
    text2vid: ""
    text2sound: ""
    pic2text: ""
    sound2text: ""
    vectorize: ""
    analyze: ""

# -- TTS (text-to-speech) sub-deployment using Piper voices
tts:
  enabled: false
  image:
    repository: ghcr.io/metadist/synaplan-tts
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 10200
  defaultVoice: "en_US-lessac-medium"
  maxTextLength: "5000"
  synthWorkers: "4"
  # Voice models downloaded from HuggingFace by init container.
  # Uses same python:3.11-slim + huggingface-hub pattern as triton chart's huggingfaceModels.
  # Set voices: [] to skip all downloads (bring your own voices on the PVC).
  huggingfaceVoices:
    image:
      repository: python
      tag: "3.11-slim"
    repo: "rhasspy/piper-voices"
    revision: ""  # pin to a known-good commit hash (recommended)
    voices:
      - name: "en_US-lessac-medium"
        subfolder: "en/en_US/lessac/medium"
      - name: "de_DE-thorsten-medium"
        subfolder: "de/de_DE/thorsten/medium"
  persistence:
    size: "5Gi"
    accessMode: "ReadWriteOnce"
    storageClass: ""

# Persistence configuration for Synaplan data
persistence:
  # User uploads - REQUIRED for production
  # Stores uploaded documents and files at /var/www/backend/var/uploads
  uploads:
    enabled: false
    existingClaim: ""
    accessMode: "ReadWriteMany"
    size: "10Gi"
    storageClass: ""

# Default values for synaplan.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/metadist/synaplan
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Additional init scripts to run on container startup
# Scripts are added to the init-scripts ConfigMap and executed by docker-entrypoint.sh
# Use numeric prefixes to control execution order (00-49: before DB, 50+: after DB)
# Example:
#   extraInitScripts:
#     02-my-script.sh: |
#       #!/bin/bash
#       echo "Hello from my script"
extraInitScripts: {}

# Additional environment variables for the application
# These are appended after the standard env vars defined in the deployment template
env:
  - name: APP_ENV
    value: "prod"
  - name: APP_DEBUG
    value: "false"

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: synaplan.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: synaplan-tls
  #    hosts:
  #      - synaplan.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
