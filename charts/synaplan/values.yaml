# Custom root CA trusted by the app (self-signed / private PKI clusters).
# Enabled when either option is set.
customRootCA:
  # -- Option 1: inline PEM certificate (the chart creates a Secret from it)
  crt: ""
  # -- Option 2: name of an existing Secret holding the CA under key ca.crt.
  # Takes precedence over crt.
  secretRef: ""

# Public URL for accessing Synaplan (e.g., https://synaplan.example.com)
publicUrl: ""

# -- Triton deployment mode (cpu or gpu) - determines which model to register in database
tritonMode: "gpu"

# Mailer configuration (Symfony mailer DSN)
# Examples: smtp://user:pass@smtp.example.com:587, null://null (disabled)
mailerDsn: "null://null"

# AI Provider API Keys (optional - leave empty to disable)
# Option 1: Plain text values (not recommended for production)
apiKeys:
  anthropic: ""
  openai: ""
  groq: ""
  googleGemini: ""
  braveSearch: ""
  huggingface: ""

# Option 2: Reference existing secrets (recommended for production)
# Create secret: kubectl create secret generic synaplan-api-keys \
#   --from-literal=anthropic-api-key=YOUR_KEY \
#   --from-literal=openai-api-key=YOUR_KEY \
#   --from-literal=groq-api-key=YOUR_KEY \
#   --from-literal=google-gemini-api-key=YOUR_KEY \
#   --from-literal=brave-search-api-key=YOUR_KEY \
#   --from-literal=huggingface-api-key=YOUR_KEY
# Then set: apiKeysSecretRef: "synaplan-api-keys"
apiKeysSecretRef: ""

# Symfony kernel secret: CSRF tokens, signed URLs, and the at-rest encryption
# of stored provider credentials. REQUIRED for production use; keep it stable,
# rotating it invalidates already-encrypted credentials.
# -- Option 1: the value, kept in the Secret <fullname>-credentials. Empty:
# the value already in that Secret; the render fails without one.
appSecret: ""
# -- Option 2: name of an existing Secret holding the value under key
# app-secret. Takes precedence over appSecret.
appSecretRef: ""

# Redis - mandatory infrastructure since synaplan 4.0 (Symfony cache,
# Messenger queues, locks, rate limiter).
redis:
  # -- Deploy a bundled single-node Redis. NOT persistent: queued async jobs
  # are lost when it restarts. Disable to use an external Redis via dsn.
  enabled: true
  # -- External Redis DSN (e.g. redis://user:pass@redis.example.svc:6379).
  # Takes precedence over the bundled Redis. Must not carry a path - the
  # Messenger transports append their stream names to it. Plain value ends up
  # in the pod spec; use dsnSecretRef for DSNs carrying credentials.
  dsn: ""
  # -- Name of an existing Secret holding the external DSN under key
  # redis-dsn. Takes precedence over dsn.
  dsnSecretRef: ""
  image:
    repository: redis
    tag: "8.10-alpine"
    pullPolicy: IfNotPresent
  resources: {}

# -- Messenger worker (SYNAPLAN_ROLE=worker): consumes the async queues (AI
# jobs, extraction, indexing). Required for synaplan >= 4.0 async features.
# Shares the uploads volume with the web pod: with a ReadWriteOnce PVC the
# worker must be co-scheduled with the web pod (set affinity accordingly) or
# the PVC switched to ReadWriteMany.
worker:
  enabled: true
  replicaCount: 1
  # -- Space-separated Messenger transport list; empty = image default.
  transports: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Scheduler (SYNAPLAN_ROLE=scheduler): periodic maintenance tasks.
# Singleton; same uploads-volume sharing caveat as the worker.
scheduler:
  enabled: true
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database configuration
database:
  host: "mariadb-cluster"
  port: "3306"
  name: "synaplan"
  user: "synaplan"
  serverVersion: "11.7.2-MariaDB"
  # -- Database password, kept in the Secret <fullname>-credentials. Empty:
  # the value already in that Secret; the render fails without one. Used
  # unless passwordSecretRef is set.
  password: ""
  # -- Name of an existing Secret holding the database password (key: password)
  passwordSecretRef: ""
  # -- Root password of a database installed next to Synaplan, kept in
  # <fullname>-credentials (key database-root-password) for that database.
  # Synaplan does not read it. Written once: a value already in that Secret
  # wins, because the database only takes its root password on first start.
  rootPassword: ""

# Triton Inference Server configuration
triton:
  # -- Triton gRPC endpoint URL. Leave empty to disable Triton backend.
  url: "triton:8001"

# Ollama configuration — recommended alternative to Triton
ollama:
  # -- Ollama API base URL. Set this to use Ollama for LLM inference and bge-m3 embedding.
  # Example: http://ollama.synaplan.svc.cluster.local:11434
  baseUrl: ""

# Tika document processing service configuration
tika:
  enabled: false
  url: "http://tika.synaplan.svc.cluster.local:9998"

# Qdrant vector database: user memories and Qdrant-backed vector search. The
# chart does not deploy Qdrant.
qdrant:
  # -- Qdrant REST URL (e.g. http://qdrant.synaplan.svc.cluster.local:6333).
  # Empty = off: the application switches memories and Qdrant search off.
  url: ""

# Office engine: Collabora CODE convert-to for thumbnails, PDF export, preview
# and combine. The chart does not deploy Collabora; on openDesk point at the
# shared in-cluster CODE service (ClusterIP, never a public URL).
# See docs/collabora-office-engine.md.
office:
  # -- Convert-to base URL (e.g. http://collabora.office.svc.cluster.local:9980).
  # Empty = off.
  convertUrl: ""
  # -- Convert timeout in milliseconds. Only emitted when convertUrl is set.
  convertTimeoutMs: 60000

# Secure compute sidecar (short Python / Node file work in chat). The chart
# does not deploy the sidecar. Both values are needed; features.compute can
# still pin the feature off.
compute:
  # -- Compute sidecar URL. Empty = off.
  url: ""
  # -- Name of an existing Secret holding the token under key compute-token.
  tokenSecretRef: ""

# Speech input. null = not emitted, the application default applies.
speech:
  # -- (bool) Browser Web Speech API. It streams microphone audio to the
  # browser vendor's cloud: set false for sovereign / air-gapped installs.
  webSpeech: null
  # -- (bool) Local whisper.cpp speech-to-text (binary ships in the image).
  whisper: null
  # -- Whisper model name (e.g. base, small). Only emitted when set.
  whisperModel: ""
  # -- Whisper server URL (`WHISPER_SERVER_URL`), e.g. the `stt` chart's
  # `http://stt.synaplan.svc.cluster.local:8080`. Speech-to-text then runs
  # there (GPU) instead of the whisper.cpp binary in the pod. Needs Synaplan
  # with the Whisper server mode; older images ignore it. Empty = off.
  whisperServerUrl: ""

# Installation-wide feature pins (synaplan >= 5.0.0). Each key maps to one
# environment variable the application already knows:
#   true  = pinned on for everyone, the admin toggle shows as locked
#   false = pinned off for everyone
#   null  = not emitted, the database row (admin UI) decides
# Leave a feature null when it should vary per group; a pin overrides group
# policy. Unknown keys fail the render. Do not set the same variables in `env`.
features:
  # -- (bool) FEATURE_IAM_GROUPS_ENABLED (people & groups)
  groups: null
  # -- (bool) FEATURE_IAM_SHARING_ENABLED (needs groups)
  sharing: null
  # -- (bool) FEATURE_IAM_USER_SEARCH_ENABLED (find any account by name/email in the share dialog)
  userSearch: null
  # -- (bool) FEATURE_IAM_DIRECTORY_SYNC_ENABLED (groups from the OIDC groups claim)
  directorySync: null
  # -- (bool) FEATURE_IAM_GROUP_POLICIES_ENABLED (needs groups)
  groupPolicies: null
  # -- (bool) FEATURE_AGENTS_ENABLED (AI assistant builder)
  agents: null
  # -- (bool) FEATURE_WORKFLOWS_BUILDER_ENABLED (Saved Tasks steps + webhook trigger)
  workflows: null
  # -- (bool) FEATURE_TOOLS_REGISTRY_ENABLED (MCP / HTTP / built-in tool registry, kill switch)
  tools: null
  # -- (bool) FEATURE_TOOLS_APPROVALS_ENABLED (ask before a changing tool runs)
  toolApprovals: null
  # -- (bool) FEATURE_TOOLS_CUSTOM_HTTP_ENABLED (user-declared HTTP / OpenAPI tools, outbound calls)
  customHttpTools: null
  # -- (bool) FEATURE_DOCUMENT_TOOLS_ENABLED (Word / Excel / PowerPoint tools)
  documentTools: null
  # -- (bool) FEATURE_DESKTOP_AGENT_ENABLED (desktop client pairing)
  desktopAgent: null
  # -- (bool) FEATURE_PLATFORM_LINKS_ENABLED (Nextcloud / ownCloud / OpenCloud account linking)
  platformLinks: null
  # -- (bool) FEATURE_MULTITASK_URL_FETCH_ENABLED (watched pages, fetches public URLs)
  urlFetch: null
  # -- (bool) FEATURE_COMPUTE_ENABLED (installation kill switch for compute)
  compute: null
  # -- (bool) FEATURE_FREEAPI_ENABLED (Synaplan Demo shared onboarding key; pinned off on Kubernetes, set true for an evaluation cluster)
  freeApi: false
  # -- (bool) REGISTRATION_ENABLED (local self-registration; false for SSO-only installs)
  registration: null
  # -- (bool) GUEST_CHAT_ENABLED (anonymous guest trial; false for SSO-only installs)
  guestChat: null
  # -- (bool) SETUP_WIZARD_ENABLED (first-run setup page on an empty database; false for SSO-only installs)
  setupWizard: null

# Any other BCONFIG flag the application pins from the environment, keyed by
# its BCONFIG name GROUP.SETTING (synaplan >= 5.0.0). The chart derives the
# variable the same way the application does: COMPUTE.EGRESS_ENABLED ->
# FEATURE_COMPUTE_EGRESS_ENABLED, MODULES.GATE_TIKA -> FEATURE_MODULES_GATE_TIKA.
# Values must be true or false. A key that maps to the same variable as a
# features.* entry fails the render. Examples:
#   featurePins:
#     COMPUTE.EGRESS_ENABLED: false
#     MULTITASK.MCP_FETCH_ENABLED: false
#     MODULES.GATE_TIKA: true
featurePins: {}

# Admin settings stored in the database (BCONFIG), keyed by their name
# GROUP.SETTING. Synaplan >= 5.1.0 reads each one from
# CONFIG_<GROUP>_<SETTING> and locks the field in the admin UI. An empty
# map leaves the database value. true/false are sent as "true"/"false".
# A map or list is sent as JSON (for IAM.DIRECTORY_GROUP_NAMES).
# These keys are refused: the application stores them encrypted or uses
# them as bookkeeping, so a pin would not take effect:
#   M365.CLIENT_SECRET, DROPBOX.APP_SECRET, DIGEST.CURSOR
# A key that features.* or featurePins already pins is refused too.
# A semver image tag below 5.1.0 fails the render (5.0.6 ignores CONFIG_*).
#   settings:
#     "IAM.DIRECTORY_GROUPS_CLAIM": "groups"
#     "IAM.ADMIN_IMPERSONATION": "audited"
#     "MCP.CLIENT_ENABLED": false
#     "BRANDING.BRAND_NAME": "Example Corp"
#     "IAM.DIRECTORY_GROUP_NAMES":
#       synaplan-users: "Synaplan users"

# -- BCONFIG admin settings (GROUP.SETTING -> CONFIG_*). Empty = database default. Requires synaplan >= 5.1.0.
settings: {}

# The same settings, with the value read from an existing Secret so it is
# not written into the pod spec. Same key rules and the same 5.1.0 gate.
#   settingSecrets:
#     "M365.CLIENT_ID":
#       name: synaplan-m365
#       key: client-id

# -- BCONFIG admin settings whose value comes from a Secret ({name, key}). Requires synaplan >= 5.1.0.
settingSecrets: {}

# First administrator for installs with local accounts. SSO-only installs
# grant admin through oidc.adminRoles instead and leave this empty.
bootstrapAdmin:
  # -- Name of an existing Secret with keys email and password
  # (BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD). Empty = off.
  secretRef: ""
  # -- Email of the first administrator, instead of secretRef. Empty = off.
  email: ""
  # -- Password of the first administrator, kept in the Secret
  # <fullname>-credentials. Written once: Synaplan creates the administrator
  # only while it has none, so a later value does not change it.
  password: ""
  # -- (bool) BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE: the password is one-time use. null = application default.
  forcePasswordChange: null

# OIDC authentication configuration
oidc:
  enabled: false
  issuerURI: ""
  clientId: ""
  # OIDC client secret
  # Option 1: the value, kept in the Secret <fullname>-credentials. Empty:
  # the value already in that Secret; the render fails without one.
  clientSecret: ""
  # Option 2: Reference to existing secret (recommended)
  # Create secret: kubectl create secret generic synaplan-oidc-credentials --from-literal=client-secret=YOUR_SECRET
  # Then set: clientSecretRef: "synaplan-oidc-credentials"
  clientSecretRef: ""
  # -- Auto-redirect to OIDC provider on login page
  autoRedirect: true
  # -- Space-separated OIDC scopes requested during login.
  # Remove offline_access if your provider doesn't support it (internal app tokens provide a 7-day fallback).
  scopes: "openid email profile offline_access"
  # -- Comma-separated claim values that make a user administrator on login
  # (OIDC_ADMIN_ROLES). Empty = application default (admin, realm-admin, synaplan-admin, administrator).
  adminRoles: ""
  # -- Comma-separated dot paths the roles are read from (OIDC_ROLE_CLAIMS);
  # {client_id} is replaced by clientId. Empty = application default (Keycloak realm/client roles + groups).
  roleClaims: ""
  # -- Extra role mapping "idp_role:SYMFONY_ROLE,..." (OIDC_ROLE_MAPPING). Empty = none.
  roleMapping: ""
  # -- Text on the sign-in button (OIDC_PROVIDER_LABEL). Empty = "Enterprise SSO".
  providerLabel: ""
  # -- Expected JWT audience for login, refresh and bearer tokens (OIDC_BEARER_AUDIENCE). Empty = clientId.
  # synaplan >= 5.3.1 also requests it at sign-in; Kinde and Auth0 need that (Kinde: the API audience).
  bearerAudience: ""
  # Who may use this instance after a successful sign-in at the provider
  # (synaplan >= 5.3.1). All empty = every authenticated identity is admitted.
  # Checked on the validated access token at login, refresh and for bearer tokens.
  accessPolicy:
    # -- Organization the token must name (OIDC_ORG_CODE); also sent as org_code at sign-in (Kinde). Empty = no check.
    orgCode: ""
    # -- Claim holding the organization (OIDC_ORG_CLAIM), e.g. organization on Keycloak. Empty = application default (org_code).
    orgClaim: ""
    # -- Comma-separated roles, at least one required (OIDC_REQUIRED_ROLE). Read from oidc.roleClaims; set roleClaims to roles for Kinde. Empty = no check.
    requiredRole: ""
    # -- Comma-separated permissions, all required (OIDC_REQUIRED_PERMISSIONS). Empty = no check.
    requiredPermissions: ""
    # -- Claim holding the permissions (OIDC_PERMISSIONS_CLAIM). Empty = application default (permissions).
    permissionsClaim: ""
    # -- (bool) Create an account on the first SSO sign-in (OIDC_ALLOW_USER_PROVISIONING). false = only people who signed in through SSO before. null = application default (true).
    allowUserProvisioning: null

# Seed built-in system prompts on startup (idempotent)
prompts:
  seed: true

# AI models to enable/disable from the built-in catalog on startup
# Keys use the format "service:providerId" (e.g. "groq:llama-3.3-70b-versatile")
# Entries can be strings or objects with a "system" flag to lock the model:
#   enabled:
#     - "groq:llama-3.3-70b-versatile"
#     - name: "ollama:bge-m3"
#       system: true
#
# Disabling never deletes rows: models are deactivated and hidden from users,
# and reappear when re-enabled.
#
# providers.* requires synaplan >= 4.3.6 (metadist/synaplan#1587 added
# model:enable/disable --provider/--only). The chart's appVersion already
# satisfies this; if you override image.tag, Helm fails the render for any
# semver tag below 4.3.6 so an incompatible image cannot crash the init
# container. Non-semver tags (latest, digests, branch builds) skip that check.
#
# Prefer providers.only for air-gapped installs: it is an allow-list, so cloud
# providers added to the catalog later are disabled automatically. In contrast,
# providers.disabled is a deny-list that must name every cloud provider and be
# updated whenever one is added (easy to miss cloudflare, higgsfield, …).
# only cannot be combined with enabled/disabled.
#
# Provider-level toggles run BEFORE the per-model lists, so per-model entries
# win — e.g. disable the whole openai provider but re-enable one of its models.
models:
  providers:
    # -- Allow-list: enable only these providers and disable every other catalog provider (air-gap)
    only: []
    # -- Providers whose complete catalog is enabled on startup (e.g. ["ollama", "groq"])
    enabled: []
    # -- Providers whose complete catalog is disabled on startup (models are kept, hidden from users)
    disabled: []
  enabled: []
  disabled: []
  # Default model per capability. Empty string = skip (no default set).
  # Keys use the same format as enable/disable (e.g. "groq:llama-3.3-70b-versatile")
  defaults:
    chat: ""
    tools: ""
    sort: ""
    summarize: ""
    text2pic: ""
    text2vid: ""
    text2sound: ""
    pic2text: ""
    sound2text: ""
    vectorize: ""
    analyze: ""

# -- TTS (text-to-speech) sub-deployment using Piper voices
tts:
  enabled: false
  # ghcr.io/metadist/synaplan-tts >= 2.0.0 ships four voices (en, de, es, tr)
  # baked into the image, nothing is downloaded at startup.
  image:
    repository: ghcr.io/metadist/synaplan-tts
    tag: "2.1.0@sha256:86bb9e9b89ea239c1ffcdfc53ada07f333fefa3da5639d21000454b6759829fc"
    pullPolicy: IfNotPresent
  port: 10200
  defaultVoice: "en_US-lessac-medium"
  maxTextLength: "5000"
  synthWorkers: "4"
  # Extra voices beyond the baked set, downloaded from HuggingFace by an init
  # container into /voices-extra (extras win over baked voices on a name
  # clash). Off by default; needs egress. Same python + huggingface-hub
  # pattern as the triton chart's huggingfaceModels.
  huggingfaceVoices:
    image:
      repository: python
      tag: "3.15-slim"
    repo: "rhasspy/piper-voices"
    revision: ""  # pin to a known-good commit hash (recommended)
    voices: []
    # - name: "ru_RU-irina-medium"
    #   subfolder: "ru/ru_RU/irina/medium"
  # Volume behind /voices-extra: holds downloaded and operator-added voices
  # (.onnx + .onnx.json pairs). Without it, downloads land in an emptyDir
  # and repeat on every pod start.
  extraVoices:
    enabled: false
    # Use an existing PVC instead of creating one.
    existingClaim: ""
    size: "1Gi"
    accessMode: "ReadWriteOnce"
    storageClass: ""

# Persistence configuration for Synaplan data
persistence:
  # User uploads - REQUIRED for production
  # Stores uploaded documents and files at /var/www/backend/var/uploads
  uploads:
    enabled: false
    existingClaim: ""
    accessMode: "ReadWriteMany"
    size: "10Gi"
    storageClass: ""

# Default values for synaplan.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/metadist/synaplan
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Additional init scripts to run on container startup
# Scripts are added to the init-scripts ConfigMap and executed by docker-entrypoint.sh
# Use numeric prefixes to control execution order (00-49: before DB, 50+: after DB)
# Example:
#   extraInitScripts:
#     02-my-script.sh: |
#       #!/bin/bash
#       echo "Hello from my script"
extraInitScripts: {}

# Additional environment variables for the application
# These are appended after the standard env vars defined in the deployment template
env:
  - name: APP_ENV
    value: "prod"
  - name: APP_DEBUG
    value: "false"

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  # The Keycloak callback sets a session cookie and a refresh-token cookie.
  # For an account with several groups those Set-Cookie headers exceed
  # ingress-nginx's default 4k proxy buffer ("upstream sent too big header"
  # -> 502) even though the login itself succeeded. These are the defaults
  # when ingress is enabled; override a key to change it.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "16k"
  hosts:
    - host: synaplan.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: synaplan-tls
  #    hosts:
  #      - synaplan.local

# -- Resources of the web pod. Empty by default so the chart installs on small
# clusters. Starting values for production (see "Capacity and probes" in the
# README): memory request 1Gi, memory limit 3Gi, processor request 1 and no
# processor limit, because throttling shows up as slow answers, not as a
# visible limit. With the watchdog on, the declared processor request and
# memory limit appear on Admin > Capacity.
resources: {}
  # requests:
  #   cpu: "1"
  #   memory: 1Gi
  # limits:
  #   memory: 3Gi

# The capacity watchdog (synaplan >= 5.6.0). One process per pod, started by
# the image in every role, listening on :8098 for /live, /ready and /metrics.
# It writes each server's load to Redis for Admin > Capacity.
watchdog:
  # -- Run the watchdog and let the web pod's probes follow PHP capacity:
  # liveness asks the watchdog, readiness turns false when PHP stops answering
  # its own probe within 2 s or Redis is down, and a startup probe gives the first
  # boot's migrations time. Off: SYNAPLAN_WATCHDOG=0, Admin > Capacity is
  # absent, and the web pod keeps `livenessProbe` / `readinessProbe` below.
  # Needs synaplan >= 5.6.0; the render fails on an older semver tag.
  enabled: false
  # -- Web pod startup probe while the watchdog is on. PHP's own readiness
  # endpoint; 120 x 5 s leaves ten minutes for the first boot's migrations.
  startupProbe:
    httpGet:
      path: /api/health/ready
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 120
  # -- Web pod liveness probe while the watchdog is on. A pod whose stream
  # pool is full stays live; only a stopped watchdog restarts it.
  livenessProbe:
    httpGet:
      path: /live
      port: watchdog
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  # -- Web pod readiness probe while the watchdog is on. The watchdog is
  # ready while PHP answered its readiness endpoint within 2 s at least once
  # in the last 10 s and Redis answers. That endpoint runs in the `api` pool,
  # so a full stream pool alone does not make the pod unready.
  readinessProbe:
    httpGet:
      path: /ready
      port: watchdog
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

# PHP runtime of the web pod. Empty keeps the image default. Every key except
# `workers` needs synaplan >= 5.6.0 (two worker pools); the render fails on an
# older semver tag.
frankenphp:
  # -- (int) PHP workers for short requests, the `api` pool (FRANKENPHP_WORKER_NUM). Image default 16.
  workers: null
  # -- (int) PHP workers for AI streams, the `streams` pool (FRANKENPHP_STREAM_WORKER_NUM). Image default: the same as `workers`.
  streamWorkers: null
  # -- (int) PHP threads at start (FRANKENPHP_NUM_THREADS). Must exceed workers + streamWorkers.
  numThreads: null
  # -- (int) Most PHP threads (FRANKENPHP_MAX_THREADS).
  maxThreads: null
  # -- (string) How long a request waits for a free worker before the server answers
  # "busy" with Retry-After (FRANKENPHP_MAX_WAIT_TIME). Image default 15s.
  maxWaitTime: null

# Prometheus and Grafana for the watchdog's metrics. Each needs
# watchdog.enabled; the render fails otherwise.
metrics:
  podMonitor:
    # -- Create a PodMonitor (Prometheus Operator) for :8098/metrics on every role.
    enabled: false
    # -- Extra labels, e.g. the `release` label your Prometheus selects on.
    labels: {}
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
  serviceMonitor:
    # -- Create a headless metrics Service and a ServiceMonitor for :8098/metrics, for a Prometheus that selects ServiceMonitors only.
    enabled: false
    # -- Extra labels, e.g. the `release` label your Prometheus selects on.
    labels: {}
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
  dashboard:
    # -- Ship the "Synaplan capacity" Grafana dashboard as a ConfigMap (`dashboards/synaplan-capacity.json`).
    enabled: false
    # -- Labels the Grafana dashboard sidecar watches for.
    labels:
      grafana_dashboard: "1"
    # -- Annotations, e.g. the folder for the Grafana sidecar.
    annotations: {}

# -- Web pod liveness probe while the watchdog is off. `GET /` is a static
# file: it never touches PHP, so a pod whose workers are all held stays live.
# More information: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 3
# -- Web pod readiness probe while the watchdog is off. Same static file, so
# it cannot see a full server; turn on the watchdog for that.
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
# The CPU target does not see AI streams: a server whose stream pool is full
# uses a few percent of a processor. Scaling on held streams comes later.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional init containers on the web Deployment (same shape as the triton
# chart's additionalInitContainers), e.g. to seed a volume declared in
# `volumes` with model files before the app starts.
additionalInitContainers: []

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
