# Custom root CA trusted by the app (self-signed / private PKI clusters).
# Enabled when either option is set.
customRootCA:
  # -- Option 1: inline PEM certificate (the chart creates a Secret from it)
  crt: ""
  # -- Option 2: name of an existing Secret holding the CA under key ca.crt.
  # Takes precedence over crt.
  secretRef: ""

# Public URL for accessing Synaplan (e.g., https://synaplan.example.com)
publicUrl: ""

# -- Triton deployment mode (cpu or gpu) - determines which model to register in database
tritonMode: "gpu"

# Mailer configuration (Symfony mailer DSN)
# Examples: smtp://user:pass@smtp.example.com:587, null://null (disabled)
mailerDsn: "null://null"

# AI Provider API Keys (optional - leave empty to disable)
# Option 1: Plain text values (not recommended for production)
apiKeys:
  anthropic: ""
  openai: ""
  groq: ""
  googleGemini: ""
  braveSearch: ""
  huggingface: ""

# Option 2: Reference existing secrets (recommended for production)
# Create secret: kubectl create secret generic synaplan-api-keys \
#   --from-literal=anthropic-api-key=YOUR_KEY \
#   --from-literal=openai-api-key=YOUR_KEY \
#   --from-literal=groq-api-key=YOUR_KEY \
#   --from-literal=google-gemini-api-key=YOUR_KEY \
#   --from-literal=brave-search-api-key=YOUR_KEY \
#   --from-literal=huggingface-api-key=YOUR_KEY
# Then set: apiKeysSecretRef: "synaplan-api-keys"
apiKeysSecretRef: ""

# Symfony kernel secret: CSRF tokens, signed URLs, and the at-rest encryption
# of stored provider credentials. REQUIRED for production use; keep it stable,
# rotating it invalidates already-encrypted credentials.
# -- Option 1: plain text (not recommended for production)
appSecret: ""
# -- Option 2: name of an existing Secret holding the value under key
# app-secret. Takes precedence over appSecret.
appSecretRef: ""

# Redis - mandatory infrastructure since synaplan 4.0 (Symfony cache,
# Messenger queues, locks, rate limiter).
redis:
  # -- Deploy a bundled single-node Redis. NOT persistent: queued async jobs
  # are lost when it restarts. Disable to use an external Redis via dsn.
  enabled: true
  # -- External Redis DSN (e.g. redis://user:pass@redis.example.svc:6379).
  # Takes precedence over the bundled Redis. Must not carry a path - the
  # Messenger transports append their stream names to it. Plain value ends up
  # in the pod spec; use dsnSecretRef for DSNs carrying credentials.
  dsn: ""
  # -- Name of an existing Secret holding the external DSN under key
  # redis-dsn. Takes precedence over dsn.
  dsnSecretRef: ""
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent
  resources: {}

# -- Messenger worker (SYNAPLAN_ROLE=worker): consumes the async queues (AI
# jobs, extraction, indexing). Required for synaplan >= 4.0 async features.
# Shares the uploads volume with the web pod: with a ReadWriteOnce PVC the
# worker must be co-scheduled with the web pod (set affinity accordingly) or
# the PVC switched to ReadWriteMany.
worker:
  enabled: true
  replicaCount: 1
  # -- Space-separated Messenger transport list; empty = image default.
  transports: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Scheduler (SYNAPLAN_ROLE=scheduler): periodic maintenance tasks.
# Singleton; same uploads-volume sharing caveat as the worker.
scheduler:
  enabled: true
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database configuration
database:
  host: "mariadb-cluster"
  port: "3306"
  name: "synaplan"
  user: "synaplan"
  serverVersion: "11.7.2-MariaDB"
  # -- Database password (plain text, not recommended for production).
  # Used unless passwordSecretRef is set.
  password: ""
  # -- Name of an existing Secret holding the database password (key: password)
  passwordSecretRef: ""

# Triton Inference Server configuration
triton:
  # -- Triton gRPC endpoint URL. Leave empty to disable Triton backend.
  url: "triton:8001"

# Ollama configuration — recommended alternative to Triton
ollama:
  # -- Ollama API base URL. Set this to use Ollama for LLM inference and bge-m3 embedding.
  # Example: http://ollama.synaplan.svc.cluster.local:11434
  baseUrl: ""

# Tika document processing service configuration
tika:
  enabled: false
  url: "http://tika.synaplan.svc.cluster.local:9998"

# OIDC authentication configuration
oidc:
  enabled: false
  issuerURI: ""
  clientId: ""
  # OIDC client secret
  # Option 1: Plain text (not recommended for production)
  clientSecret: ""
  # Option 2: Reference to existing secret (recommended)
  # Create secret: kubectl create secret generic synaplan-oidc-credentials --from-literal=client-secret=YOUR_SECRET
  # Then set: clientSecretRef: "synaplan-oidc-credentials"
  clientSecretRef: ""
  # -- Auto-redirect to OIDC provider on login page
  autoRedirect: true
  # -- Space-separated OIDC scopes requested during login.
  # Remove offline_access if your provider doesn't support it (internal app tokens provide a 7-day fallback).
  scopes: "openid email profile offline_access"

# Seed built-in system prompts on startup (idempotent)
prompts:
  seed: true

# AI models to enable/disable from the built-in catalog on startup
# Keys use the format "service:providerId" (e.g. "groq:llama-3.3-70b-versatile")
# Entries can be strings or objects with a "system" flag to lock the model:
#   enabled:
#     - "groq:llama-3.3-70b-versatile"
#     - name: "ollama:bge-m3"
#       system: true
#
# Disabling never deletes rows: models are deactivated and hidden from users,
# and reappear when re-enabled.
#
# providers.* requires synaplan >= 4.3.6 (metadist/synaplan#1587 added
# model:enable/disable --provider/--only). The chart's appVersion already
# satisfies this; if you override image.tag, Helm fails the render for any
# semver tag below 4.3.6 so an incompatible image cannot crash the init
# container. Non-semver tags (latest, digests, branch builds) skip that check.
#
# Prefer providers.only for air-gapped installs: it is an allow-list, so cloud
# providers added to the catalog later are disabled automatically. In contrast,
# providers.disabled is a deny-list that must name every cloud provider and be
# updated whenever one is added (easy to miss cloudflare, higgsfield, …).
# only cannot be combined with enabled/disabled.
#
# Air-gapped example (local inference and speech only):
#   models:
#     providers:
#       only: ["ollama", "piper", "whisper"]
#
# Provider-level toggles run BEFORE the per-model lists, so per-model entries
# win — e.g. disable the whole openai provider but re-enable one of its models.
models:
  providers:
    # -- Allow-list: enable only these providers and disable every other catalog provider (air-gap)
    only: []
    # -- Providers whose complete catalog is enabled on startup (e.g. ["ollama", "groq"])
    enabled: []
    # -- Providers whose complete catalog is disabled on startup (models are kept, hidden from users)
    disabled: []
  enabled: []
  disabled: []
  # Default model per capability. Empty string = skip (no default set).
  # Keys use the same format as enable/disable (e.g. "groq:llama-3.3-70b-versatile")
  defaults:
    chat: ""
    tools: ""
    sort: ""
    summarize: ""
    text2pic: ""
    text2vid: ""
    text2sound: ""
    pic2text: ""
    sound2text: ""
    vectorize: ""
    analyze: ""

# -- TTS (text-to-speech) sub-deployment using Piper voices
tts:
  enabled: false
  # ghcr.io/metadist/synaplan-tts >= 2.0.0 ships four voices (en, de, es, tr)
  # baked into the image, nothing is downloaded at startup.
  image:
    repository: ghcr.io/metadist/synaplan-tts
    tag: "2.0.0"
    digest: "sha256:c2aa56d90a30fc9c55ee76e4a2e7857d5705e4ecf4c8f256740407e0b9f61cd8"
    pullPolicy: IfNotPresent
  port: 10200
  defaultVoice: "en_US-lessac-medium"
  maxTextLength: "5000"
  synthWorkers: "4"
  # Extra voices beyond the baked set, downloaded from HuggingFace by an init
  # container into /voices-extra (extras win over baked voices on a name
  # clash). Off by default; needs egress. Same python + huggingface-hub
  # pattern as the triton chart's huggingfaceModels.
  huggingfaceVoices:
    image:
      repository: python
      tag: "3.11-slim"
    repo: "rhasspy/piper-voices"
    revision: ""  # pin to a known-good commit hash (recommended)
    voices: []
    # - name: "ru_RU-irina-medium"
    #   subfolder: "ru/ru_RU/irina/medium"
  # Volume behind /voices-extra: holds downloaded and operator-added voices
  # (.onnx + .onnx.json pairs). Without it, downloads land in an emptyDir
  # and repeat on every pod start.
  extraVoices:
    enabled: false
    # Use an existing PVC instead of creating one.
    existingClaim: ""
    size: "1Gi"
    accessMode: "ReadWriteOnce"
    storageClass: ""

# Persistence configuration for Synaplan data
persistence:
  # User uploads - REQUIRED for production
  # Stores uploaded documents and files at /var/www/backend/var/uploads
  uploads:
    enabled: false
    existingClaim: ""
    accessMode: "ReadWriteMany"
    size: "10Gi"
    storageClass: ""

# Default values for synaplan.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/metadist/synaplan
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Additional init scripts to run on container startup
# Scripts are added to the init-scripts ConfigMap and executed by docker-entrypoint.sh
# Use numeric prefixes to control execution order (00-49: before DB, 50+: after DB)
# Example:
#   extraInitScripts:
#     02-my-script.sh: |
#       #!/bin/bash
#       echo "Hello from my script"
extraInitScripts: {}

# Additional environment variables for the application
# These are appended after the standard env vars defined in the deployment template
env:
  - name: APP_ENV
    value: "prod"
  - name: APP_DEBUG
    value: "false"

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: synaplan.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: synaplan-tls
  #    hosts:
  #      - synaplan.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional init containers on the web Deployment (same shape as the triton
# chart's additionalInitContainers), e.g. to seed a volume declared in
# `volumes` with model files before the app starts.
additionalInitContainers: []

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
