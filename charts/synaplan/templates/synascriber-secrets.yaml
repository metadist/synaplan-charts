{{- if .Values.synascriber.enabled }}
{{- $prosody := include "synaplan.synascriber.secretValue" (dict "ctx" . "key" "prosody-secret" "value" .Values.synascriber.secrets.prosodySecret) }}
{{- $token := include "synaplan.synascriber.secretValue" (dict "ctx" . "key" "transcriber-token" "value" .Values.synascriber.secrets.transcriberToken) }}
{{- $apiKey := include "synaplan.synascriber.secretValue" (dict "ctx" . "key" "api-key" "value" .Values.synascriber.secrets.apiKey "prefix" "sk_") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synaplan.synascriber.name" . }}
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: synascriber
type: Opaque
stringData:
  prosody-secret: {{ $prosody | quote }}
  transcriber-token: {{ $token | quote }}
  api-key: {{ $apiKey | quote }}
---
# Environment of Jitsi's Prosody (prosody.extraEnvFrom in Jitsi's values)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synaplan.synascriber.name" . }}-prosody
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: synascriber
type: Opaque
stringData:
  SYNASCRIBER_SECRET: {{ $prosody | quote }}
---
# Environment of Jitsi's Jicofo (jicofo.extraEnvFrom): its transcription
# config reads ${?SYNASCRIBER_TRANSCRIBER_TOKEN} for the bridge's Authorization header
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synaplan.synascriber.name" . }}-jicofo
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: synascriber
type: Opaque
stringData:
  SYNASCRIBER_TRANSCRIBER_TOKEN: {{ $token | quote }}
{{- end }}
