{{- if .Values.c2paSigner.enabled }}
{{- include "synaplan.c2paSigner.validate" . }}
{{- $alg := .Values.c2paSigner.alg | default "ps256" | toString | trim | lower }}
{{- $port := int .Values.c2paSigner.port }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synaplan.c2paSigner.fullname" . }}
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: c2pa-signer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "synaplan.c2paSigner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synaplan.c2paSigner.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: c2pa-signer
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: c2pa-signer
          image: {{ .Values.c2paSigner.image | trim | quote }}
          imagePullPolicy: {{ .Values.c2paSigner.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: C2PA_SIGNER_ADDR
              value: {{ printf ":%d" $port | quote }}
            - name: C2PA_ALG
              value: {{ $alg | quote }}
            - name: C2PA_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.c2paSigner.keySecretRef | trim | quote }}
                  key: key.pem
            - name: C2PA_SIGN_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.c2paSigner.certSecretRef | trim | quote }}
                  key: cert.pem
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.c2paSigner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
      {{- with .Values.c2paSigner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.c2paSigner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
