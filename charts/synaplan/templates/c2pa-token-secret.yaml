{{- if and .Values.c2paSigner.enabled (not (.Values.c2paSigner.tokenSecretRef | default "" | toString | trim)) }}
{{- include "synaplan.c2paSigner.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synaplan.c2paSigner.tokenSecretName" . }}
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "synaplan.c2paSigner.token" . | b64enc }}
{{- end }}
