{{- if .Values.metrics.podMonitor.enabled }}
{{- if not .Values.watchdog.enabled }}
{{- fail "metrics.podMonitor scrapes the watchdog on :8098; set watchdog.enabled=true (synaplan >= 5.6.0)" }}
{{- end }}
# Scrapes every role's watchdog: web pods report FrankenPHP's metrics and the
# stream slots, worker and scheduler pods report synaplan_server_info.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "synaplan.fullname" . }}
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    {{- with .Values.metrics.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "synaplan.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: watchdog
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.podMonitor.scrapeTimeout }}
{{- end }}
