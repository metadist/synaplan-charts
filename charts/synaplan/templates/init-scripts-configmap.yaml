apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synaplan.fullname" . }}-init-scripts
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
data:
  {{- if include "synaplan.customRootCA.enabled" . }}
  00-setup-ca.sh: |
    {{- include "synaplan.initScript.setupCa" . | nindent 4 }}
  {{- end }}

  01-setup-env.sh: |
    {{- include "synaplan.initScript.setupEnv" . | nindent 4 }}

  50-wait-database.sh: |
    #!/bin/bash
    # Wait for database connection to be ready
    # All scripts numbered 51+ will run after database is available

    cd /var/www/backend
    echo "⏳ Waiting for database connection..."

    for i in {1..60}; do
      if php bin/console dbal:run-sql "SELECT 1" > /dev/null 2>&1; then
        echo "✅ Database is ready!"
        exit 0
      fi
      sleep 1
    done

    echo "❌ Database not ready after 60 seconds"
    exit 1

  51-init-models.sh: |
    #!/bin/bash
    set -e
    # Sync AI models using built-in catalog commands
    # Runs after database is ready (50-wait-database.sh)

    cd /var/www/backend

    # Ensure database schema is ready
    # FIXME: this is a hack until we properly handle migrations and DATABASE_*_URLs
    echo "🔄 Running database schema update..."
    php bin/console doctrine:schema:update --force
    echo "✅ Database schema ready!"

    {{- if .Values.prompts.seed }}
    # Seed built-in system prompts
    synaplan prompt:seed
    {{- end }}

    {{- /* Provider-level toggles run first so per-model entries below win. */}}
    {{- $providers := .Values.models.providers | default dict }}
    {{- $only := $providers.only | default list }}
    {{- $enabledProviders := $providers.enabled | default list }}
    {{- $disabledProviders := $providers.disabled | default list }}
    {{- $hasProviderToggles := or (gt (len $only) 0) (gt (len $enabledProviders) 0) (gt (len $disabledProviders) 0) }}
    {{- if $hasProviderToggles }}
    {{- if and (gt (len $only) 0) (or (gt (len $enabledProviders) 0) (gt (len $disabledProviders) 0)) }}
    {{- fail "models.providers.only cannot be combined with models.providers.enabled or models.providers.disabled. Use only (allow-list) or enabled/disabled (deny-list), not both." }}
    {{- end }}
    {{- /* model:enable/disable learned --provider / --only in synaplan 4.3.6
           (metadist/synaplan#1587); older images crash the init container on
           these flags. Gate by semver so every future release passes without
           maintaining a list of bad tags. Non-semver tags (latest, digests,
           branch builds) cannot be compared and skip the check — the operator
           who pins them is responsible for picking a compatible build. */}}
    {{- $tag := .Values.image.tag | default .Chart.AppVersion | toString | trimPrefix "v" }}
    {{- if and (regexMatch `^\d+\.\d+\.\d+` $tag) (semverCompare "< 4.3.6" $tag) }}
    {{- fail (printf "models.providers.* requires synaplan >= 4.3.6 (metadist/synaplan#1587 added model:enable/disable --provider/--only); effective image tag is %q, which would crash the init container. Set image.tag to 4.3.6 or newer, or remove models.providers.*." $tag) }}
    {{- end }}
    {{- end }}
    {{- if $only }}
    synaplan model:enable{{ range $only }} --only {{ . }}{{ end }}
    {{- else }}
    {{- if $enabledProviders }}
    synaplan model:enable{{ range $enabledProviders }} --provider {{ . }}{{ end }}
    {{- end }}
    {{- if $disabledProviders }}
    synaplan model:disable{{ range $disabledProviders }} --provider {{ . }}{{ end }}
    {{- end }}
    {{- end }}

    {{- $regularModels := list }}
    {{- $systemModels := list }}
    {{- range .Values.models.enabled }}
    {{- if kindIs "string" . }}
    {{- $regularModels = append $regularModels . }}
    {{- else }}
    {{- if .system }}
    {{- $systemModels = append $systemModels .name }}
    {{- else }}
    {{- $regularModels = append $regularModels .name }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if $regularModels }}
    synaplan model:enable {{ $regularModels | join " " }}
    {{- end }}
    {{- if $systemModels }}
    synaplan model:enable --system {{ $systemModels | join " " }}
    {{- end }}

    {{- if .Values.models.disabled }}
    synaplan model:disable {{ .Values.models.disabled | join " " }}
    {{- end }}

    {{- range $capability, $modelKey := .Values.models.defaults }}
    {{- if $modelKey }}
    synaplan model:set-default {{ $modelKey }} {{ $capability }}
    {{- end }}
    {{- end }}
  {{- range $name, $content := .Values.extraInitScripts }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
