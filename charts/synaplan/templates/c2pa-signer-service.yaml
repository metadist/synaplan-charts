{{- if .Values.c2paSigner.enabled }}
{{- include "synaplan.c2paSigner.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synaplan.c2paSigner.fullname" . }}
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: c2pa-signer
spec:
  type: ClusterIP
  ports:
    - port: {{ int .Values.c2paSigner.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "synaplan.c2paSigner.selectorLabels" . | nindent 4 }}
{{- end }}
