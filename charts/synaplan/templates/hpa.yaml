{{- $source := include "synaplan.streamSlotsSource" . }}
{{- if and .Values.autoscaling.enabled (ne $source "keda") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "synaplan.fullname" . }}
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "synaplan.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  {{- if not (kindIs "invalid" .Values.autoscaling.scaleDownStabilizationSeconds) }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
  {{- end }}
  metrics:
    {{- if eq $source "prometheus-adapter" }}
    # The web Deployment's selector also matches the worker, scheduler, Redis
    # and pump pods, which publish no ratio. An External metric summed over
    # this release with an AverageValue target does not depend on that pod
    # count: replicas = ceil(sum of ratios / targetRatio).
    - type: External
      external:
        metric:
          name: synaplan_stream_slots_busy
          selector:
            matchLabels:
              app_kubernetes_io_instance: {{ .Release.Name | quote }}
        target:
          type: AverageValue
          averageValue: {{ printf "%dm" (mulf .Values.autoscaling.streamSlots.targetRatio 1000 | int) }}
    {{- end }}
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
