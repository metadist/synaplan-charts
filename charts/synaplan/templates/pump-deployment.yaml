{{- if .Values.pump.enabled }}
{{- include "synaplan.requirePumpImage" . }}
# Stream pump (SYNAPLAN_ROLE=pump): same image and environment as the web
# pod. PHP is pid 1 of the container, so SIGTERM reaches the drain: the pump
# stops claiming turns and finishes the ones it holds within the grace period.
# A rollout starts the new pump before it stops an old one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synaplan.fullname" . }}-pump
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: pump
spec:
  replicas: {{ .Values.pump.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "synaplan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pump
  template:
    metadata:
      annotations:
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/init-scripts: {{ include (print $.Template.BasePath "/init-scripts-aux-configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ include "synaplan.credentials" . | sha256sum }}
      labels:
        {{- include "synaplan.labels" . | nindent 8 }}
        app.kubernetes.io/component: pump
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.pump.terminationGracePeriodSeconds }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "synaplan.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "synaplan.initContainers" . | nindent 6 }}
      containers:
        - name: pump
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.watchdog.enabled }}
          ports:
            - name: watchdog
              containerPort: 8098
              protocol: TCP
          {{- end }}
          env:
            - name: SYNAPLAN_ROLE
              value: "pump"
            {{- include "synaplan.watchdogEnv" (dict "ctx" . "container" "pump" "deployment" (printf "%s-pump" (include "synaplan.fullname" .)) "resources" .Values.pump.resources) | nindent 12 }}
            # The role startup gate curls the web role's health endpoint;
            # the image default (http://backend) is the compose hostname.
            - name: SYNAPLAN_WEB_HEALTH_URL
              value: "http://{{ include "synaplan.fullname" . }}:{{ .Values.service.port }}/api/health"
            {{- include "synaplan.env" . | nindent 12 }}
          {{- with .Values.pump.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.pump.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "synaplan.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "synaplan.volumes" (dict "ctx" . "certs" true "initScripts" (printf "%s-init-scripts-aux" (include "synaplan.fullname" .))) | nindent 8 }}
      {{- with .Values.pump.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pump.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pump.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
