{{- if .Values.scheduler.enabled }}
# Scheduler (SYNAPLAN_ROLE=scheduler): periodic maintenance loop. Singleton;
# same image/env/volume sharing as the worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synaplan.fullname" . }}-scheduler
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "synaplan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      annotations:
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        checksum/init-scripts: {{ include (print $.Template.BasePath "/init-scripts-aux-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "synaplan.labels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "synaplan.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SYNAPLAN_ROLE
              value: "scheduler"
            # See worker-deployment.yaml: compose-hostname default.
            - name: SYNAPLAN_WEB_HEALTH_URL
              value: "http://{{ include "synaplan.fullname" . }}:{{ .Values.service.port }}/api/health"
            {{- include "synaplan.env" . | nindent 12 }}
          {{- with .Values.scheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "synaplan.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "synaplan.volumes" (dict "ctx" . "initScripts" (printf "%s-init-scripts-aux" (include "synaplan.fullname" .))) | nindent 8 }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
