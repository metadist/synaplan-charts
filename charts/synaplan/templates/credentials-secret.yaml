{{- with include "synaplan.credentials" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synaplan.credentials.secretName" $ }}
  labels:
    {{- include "synaplan.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- . | trim | nindent 2 }}
{{- end }}
