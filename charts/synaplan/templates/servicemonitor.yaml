{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.watchdog.enabled }}
{{- fail "metrics.serviceMonitor scrapes the watchdog on :8098; set watchdog.enabled=true (synaplan >= 5.6.0)" }}
{{- end }}
# Headless, so Prometheus scrapes each pod's watchdog, not one behind a
# load balancer. Pods without the watchdog port have no endpoint here. The
# fullname is cut to 55 characters so the Service name stays within 63.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synaplan.fullname" . | trunc 55 | trimSuffix "-" }}-metrics
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  ports:
    - name: watchdog
      port: 8098
      targetPort: watchdog
      protocol: TCP
  selector:
    {{- include "synaplan.selectorLabels" . | nindent 4 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "synaplan.fullname" . }}
  labels:
    {{- include "synaplan.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "synaplan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: watchdog
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
