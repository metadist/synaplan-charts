# HuggingFace model auto-download configuration
huggingfaceModels:
  enabled: true
  # List of models to download from HuggingFace
  models:
    - source: openai/gpt-oss-20b
      name: gpt-oss-20b
      revision: 6cee5e81ee83917806bbde320786a8fb61efebee
      ignorePatterns:
        - "original/*"
        - "metal/*"
  # Example:
  # - source: mistralai/Mistral-7B-Instruct-v0.3
  #   name: mistral-7b-instruct-v0.3
  #   revision: 0d4b76e1efeb5eb6f6b5e757c79870472e04bd3a  # optional
  #   ignorePatterns:  # optional
  #     - "*.safetensors"
  image:
    repository: python
    tag: "3.11-slim"

# Backend selection: "vllm" (GPU) or "python" (CPU via HuggingFace transformers)
# Can be overridden per model with explicit .vllm or .python section.
#
# NOTE: CPU mode is intended for development and testing only — it is not suited
# for production workloads.
defaultBackend: vllm

# Default vLLM parameters merged into every vllm model's model.json
vllmDefaults:
  max_model_len: 4096
  enforce_eager: true

# Default Python backend parameters merged into every python model's model.json
pythonDefaults:
  dtype: bfloat16

# Install the `accelerate` Python package at startup (required by transformers
# for quantized model loading, e.g. MXFP4). Not bundled in upstream Triton
# images. Enabled by default because the default model (gpt-oss-20b) uses MXFP4.
# For non-quantized models this is harmless but unnecessary.
installAccelerate: true

# Streaming BLS wrapper — always deployed unless explicitly disabled.
# Not part of models: list. Provides chat template + streaming proxy.
streaming:
  enabled: true

# Model repository — each entry becomes a Triton model using the resolved backend.
# Backend is determined by: explicit .vllm/.python section > defaultBackend
models:
  - name: gpt-oss-20b

# Explicit model control mode.
# When enabled, models are NOT loaded at startup. Instead, they must be loaded
# on-demand via the Triton model control API (POST /v2/repository/models/{name}/load).
# Only models listed in explicitModelControl.loadModels are loaded at startup.
# This is useful when multiple models share a single GPU and don't fit simultaneously,
# allowing you to load/unload models dynamically to stay within VRAM limits.
explicitModelControl:
  enabled: false
  # Models to load at startup (e.g., lightweight wrapper models)
  loadModels:
    - streaming

# Default values for triton.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# Deployment strategy configuration
# Default is Recreate because GPU resources must be released before new pods can acquire them
# For clusters with multiple GPUs or CPU-only deployments, you can use RollingUpdate
strategy:
  type: Recreate
  # Uncomment for RollingUpdate strategy (only recommended with multiple GPUs or CPU mode)
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nvcr.io/nvidia/tritonserver
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion with variant suffix.
  tag: ""
  # Image variant suffix (e.g., "-vllm-python-py3")
  # Appended to appVersion to form the complete tag
  variant: "-vllm-python-py3"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # runAsUser: 1000
  # fsGroup: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP

# resources:
#   requests:
#     cpu: "2"
#     memory: "24Gi"
#     nvidia.com/gpu: 1

#  limits:
#    cpu: "4"
#    memory: "24Gi"

# This is to setup the liveness, readiness and startup probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
startupProbe:
  httpGet:
    path: /v2/health/ready
    port: http
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /v2/health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v2/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # Standard resource-based metrics
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

  # Custom metrics configuration (requires Prometheus and prometheus-adapter)
  # Overrides targetCPU/Memory settings when specified
  # metrics: []
  # Example: Scale based on average queue time (requires Prometheus metrics)
  # metrics:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: avg_time_queue_us
  #       target:
  #         type: AverageValue
  #         averageValue: 50

# Additional volumes on the output Deployment definition.
# NOTE: hostPath is used by default for performance reasons (local SSD/NVMe access).
# The DirectoryOrCreate type ensures the directory is created on each node automatically.
# This means pods are node-specific but provides optimal I/O for model weights and engine cache.
# For shared storage across nodes, replace with PersistentVolumeClaim (at the cost of performance).
volumes:
  - name: triton-cache
    hostPath:
      path: /var/lib/triton-cache
      type: DirectoryOrCreate

# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: triton-cache
    mountPath: /cache
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

additionalInitContainers: []
