# OpenCloud plugin for Synaplan: the service that exchanges a person's
# OpenCloud token for Synaplan calls, and the web extension OpenCloud serves
# from the same image (/web/apps/synaplan). The OpenCloud installation itself
# is not deployed here: point its proxy at this Service and mount the
# extension from the image. Meeting notes stay in the synaplan chart.

# -- Synaplan as users open it. Required.
synaplanUrl: ""

image:
  # -- Image of the plugin (service and web extension)
  repository: ghcr.io/metadist/synaplan-opencloud
  # -- Tag of the image, a release with its digest
  tag: "1.1.0@sha256:0ba46f404657cbce3fd778738bdb97ad0aec5b90fe61ca34f4e169fa8e2c3b24"
  # -- Pull policy
  pullPolicy: IfNotPresent
# -- Image pull secrets
imagePullSecrets: []

# -- Container port. The Service uses the same port.
port: 9106
# -- Log level of the service (SYNAPLAN_LOG_LEVEL): debug, info, warn or error
logLevel: info
# -- Optional shared API key Secret. Leave the name empty to use token exchange or to configure the key later.
apiKeySecret: ""
# -- Key in apiKeySecret
apiKeySecretKey: api-key

# The plugin's own OpenCloud settings, passed through when set.
# -- OpenCloud CS3 gateway (OC_REVA_GATEWAY). Empty leaves it unset.
revaGateway: ""
# -- Secret holding the OpenCloud JWT (OC_JWT_SECRET). Empty leaves it unset.
jwtSecretSecret: ""
# -- Key in jwtSecretSecret
jwtSecretKey: jwt-secret
# -- (bool) Skip TLS verification towards OpenCloud (OC_INSECURE), for an install with
# self-signed certificates. null leaves it unset.
insecure: null
oidc:
  # -- Keycloak token endpoint for token exchange. Empty leaves it unset.
  tokenEndpoint: ""
  # -- Confidential client id for token exchange. Empty leaves it unset.
  exchangeClientId: ""
  # -- Secret holding the exchange client secret. Empty leaves it unset.
  exchangeSecretSecret: ""
  # -- Key in exchangeSecretSecret
  exchangeSecretKey: client-secret
  # -- Audience of the exchanged token, usually the Synaplan client id. Empty leaves it unset.
  targetAudience: ""

# A private PKI: the CA the plugin trusts when it calls Keycloak, Synaplan
# and OpenCloud over TLS.
customRootCA:
  # -- Name of an existing Secret holding the CA certificate. It is mounted and set as
  # SSL_CERT_FILE. Empty = the image's system CAs.
  secretRef: ""
  # -- Key of the certificate in secretRef
  key: ca.crt

# -- Extra environment variables of the container
extraEnv: []
# -- Extra volumes of the pod
extraVolumes: []
# -- Extra volume mounts of the container
extraVolumeMounts: []

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Override the chart name
nameOverride: ""
# -- Override the full resource name
fullnameOverride: ""
