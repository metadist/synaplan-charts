suite: portal jobs
templates:
  - job.yaml
values:
  - ../../../ci/synaplan-opendesk/lint-values.yaml
tests:
  - it: applies the tile after install and upgrade
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTAL_ACTION
            value: apply

  - it: removes the tile before the release is deleted
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORTAL_ACTION
            value: delete
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LDAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ums-ldap-server-admin
                key: password
                optional: true

  - it: keeps a long release name inside the 63-character Job limit
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-remove
