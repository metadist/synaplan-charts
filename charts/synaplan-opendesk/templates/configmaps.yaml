{{- if and .Values.enabled (eq (include "synaplan-opendesk.files" .) "nextcloud") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synaplan-opendesk.fullname" . }}-nextcloud
  labels:
    {{- include "synaplan-opendesk.labels" . | nindent 4 }}
data:
  nextcloud.sh: |
{{ .Files.Get "files/nextcloud.sh" | indent 4 }}
{{- end }}
{{- if and .Values.enabled .Values.portal.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synaplan-opendesk.fullname" . }}-portal
  labels:
    {{- include "synaplan-opendesk.labels" . | nindent 4 }}
data:
  portal.py: |
{{ .Files.Get "files/portal.py" | indent 4 }}
  bird.svg: |
{{ .Files.Get "files/bird.svg" | indent 4 }}
{{- end }}
