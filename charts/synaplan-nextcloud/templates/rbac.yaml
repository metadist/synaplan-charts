apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synaplan-nextcloud.fullname" . }}
  labels:
    {{- include "synaplan-nextcloud.labels" . | nindent 4 }}
---
# occ runs inside the file service. The app volume is owned by root and mounted
# into a read-only image, so a version change is written by a separate pod and
# occ is reached with pods/exec. Pod names are assigned at runtime, so exec
# cannot be limited to one name. Scale and rollout are limited to the
# configured deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "synaplan-nextcloud.fullname" . }}
  labels:
    {{- include "synaplan-nextcloud.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.nextcloud.deployment | quote }}]
    verbs: ["get", "patch", "update"]
  # list and watch cannot be limited by name. rollout status needs them.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ .Values.nextcloud.deployment | quote }}]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "synaplan-nextcloud.fullname" . }}
  labels:
    {{- include "synaplan-nextcloud.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "synaplan-nextcloud.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "synaplan-nextcloud.fullname" . }}
    namespace: {{ .Release.Namespace }}
