{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stt.fullname" . }}
  labels:
    {{- include "stt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stt.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.from }}
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
        # helm test runs in this namespace and is not one of the caller's peers.
        - podSelector:
            matchLabels:
              {{- include "stt.testPodLabel" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
