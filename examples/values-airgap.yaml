# Air-gapped overlay for the Synaplan chart.
#
# Local inference and speech only. Cloud catalog rows are soft-disabled at
# startup (kept in the database, hidden from users) and stay off when a later
# release adds a provider. This file is an overlay, not a full values file:
#
#   helm install synaplan ./charts/synaplan -f examples/values-airgap.yaml
#
# Requires synaplan >= 4.3.6 (model:enable --only). Pull the Ollama models
# before users sign in — a row appears only after that model is pulled.
# Replace ollama.baseUrl with the in-cluster address of your Ollama service.
# For an openDesk estate use examples/values-opendesk.yaml instead.

triton:
  # Chart default points at a Triton service. Blank it when this cluster has none.
  url: ""

ollama:
  baseUrl: "http://ollama.synaplan.svc.cluster.local:11434"

models:
  providers:
    # Allow-list. Cannot be combined with models.providers.enabled or .disabled.
    only:
      - ollama
      - piper
      - whisper

speech:
  # Chrome's Web Speech API sends audio to Google. Record for on-server Whisper instead.
  webSpeech: false
  whisper: true
  whisperModel: "base"
