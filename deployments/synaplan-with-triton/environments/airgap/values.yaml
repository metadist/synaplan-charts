# Air-gapped example: local inference and speech only.
#
# No Triton; chat and embeddings run on an Ollama you provide. Cloud catalog
# rows are soft-disabled at startup (kept in the database, hidden from users)
# and stay off when a later release adds a provider.
#
# Requires synaplan >= 4.3.6 (model:enable --only). Pull the Ollama models
# before users sign in: a row appears only after that model is pulled.

cluster:
  ingressClassName: nginx
  customRootCA: false

services:
  synaplan:
    url: https://synaplan.local
    oidc:
      issuerURI: https://keycloak.local/realms/default
      clientId: synaplan
    ollama:
      baseUrl: http://ollama.synaplan.svc.cluster.local:11434
    # Values of charts/synaplan, merged last.
    values:
      models:
        providers:
          # Allow-list. Cannot be combined with models.providers.enabled or .disabled.
          only:
            - ollama
            - piper
            - whisper
      speech:
        # Chrome's Web Speech API sends audio to Google. Record for on-server Whisper instead.
        webSpeech: false
        whisper: true
        whisperModel: "base"
  triton:
    mode: remote
