# Example environment: models run on an Ollama you already operate. This
# deployment does not install it.
# Merged over environments/_bases/common/values.yaml.

services:
  backend: ollama
  synaplan:
    ollama:
      baseUrl: http://ollama.example.svc.cluster.local:11434
    # Models of that Ollama. Pull them there before users sign in.
    models:
      enabled:
        - "ollama:gpt-oss:20b"
        - "ollama:bge-m3"
        - "piper:piper-multi"
      defaults:
        chat: "ollama:gpt-oss:20b"
        sort: "ollama:gpt-oss:20b"
        vectorize: "ollama:bge-m3"
