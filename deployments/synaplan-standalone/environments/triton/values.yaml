# Example environment: models run on a Triton that this deployment installs.
# Minimal settings - most config is in values templates

cluster:
  ingressClassName: nginx
  customRootCA: false

services:
  synaplan:
    url: https://synaplan.local
    oidc:
      issuerURI: https://keycloak.local/realms/default
      clientId: synaplan
    models:
      enabled:
        - "triton:gpt-oss-20b"
        - "triton:bge-m3"
        - "triton:mistral-7b-instruct-v0.3"
        - "piper:piper-multi"
      defaults:
        chat: "triton:gpt-oss-20b"
        sort: "triton:gpt-oss-20b"
        vectorize: "triton:bge-m3"
        text2sound: "piper:piper-multi"
  tts:
    enabled: true
    huggingfaceVoices:
      voices:
        - name: "en_US-lessac-medium"
          subfolder: "en/en_US/lessac/medium"
        - name: "de_DE-thorsten-medium"
          subfolder: "de/de_DE/thorsten/medium"
  # "triton-gpu" needs an NVIDIA GPU; "triton-cpu" runs without one, slowly.
  backend: triton-gpu
  # false: only models that run in the cluster are offered, and the browser's
  # Web Speech API (audio goes to the browser vendor) is off. true lifts both.
  cloudProviders: false
  # Speech-to-text server (charts/stt): "" off, "gpu" or "cpu". "gpu" needs a
  # second GPU next to Triton, or a time-sliced share. services.stt.values is
  # passed to the stt chart as-is (node selector, tolerations, resources,
  # service.port, nameOverride, fullnameOverride). The Synaplan URL follows
  # the chart's Service name and port.
  stt:
    mode: ""
