name: E2E nightly

# Pull requests test against the pinned openDesk release; this run catches
# changes in openDesk's develop branch before they reach a release.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      opendesk-ref:
        description: openDesk tag or branch. Empty = the pinned release.
        required: false
        type: string
        default: ''
      jitsi:
        description: Deploy Jitsi too
        required: false
        type: boolean
        default: true
      synascriber:
        description: Deploy meeting notes too and test them (needs a Synaplan image with the plugin and the pinned ghcr.io/metadist/synaplan-transcriber)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  opendesk-develop:
    name: openDesk ${{ github.event_name == 'schedule' && 'develop' || inputs.opendesk-ref || 'pinned release' }}
    uses: ./.github/workflows/e2e.yaml
    with:
      environment: opendesk
      opendesk-ref: ${{ github.event_name == 'schedule' && 'develop' || inputs.opendesk-ref }}
      opendesk-jitsi: ${{ github.event_name == 'schedule' || inputs.jitsi }}
      opendesk-synascriber: ${{ github.event_name != 'schedule' && inputs.synascriber }}
