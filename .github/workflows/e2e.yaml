name: E2E

on:
  workflow_call:
    inputs:
      environment:
        description: Directory in e2e/environments
        required: true
        type: string
      opendesk-ref:
        description: openDesk tag or branch (opendesk environment). Empty = the pinned release.
        required: false
        type: string
        default: ''
      opendesk-jitsi:
        description: Deploy Jitsi (opendesk environment); false leaves it out
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    runs-on: ${{ inputs.environment == 'opendesk' && 'ubuntu-latest-m' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # openDesk's images need more than the runner's free disk.
      - name: Free disk space
        if: inputs.environment == 'opendesk'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # openDesk needs Helm 3.17.3 or newer.
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install helmfile and k3d
        run: make install-helmfile install-k3d

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Deploy and run the suite
        env:
          E2E_OPENDESK_REF: ${{ inputs.opendesk-ref }}
          E2E_OPENDESK_JITSI: ${{ inputs.opendesk-jitsi }}
        run: e2e/run.sh ${{ inputs.environment }}

      - name: Show the cluster
        if: failure()
        env:
          KUBECONFIG: e2e/.kubeconfig-${{ inputs.environment }}
        run: |
          kubectl get pods,jobs,ingress -A
          kubectl describe nodes | sed -n '/^Conditions:/,/^Events:/p'
          kubectl get events -A --sort-by=.lastTimestamp | grep -v ' Normal ' | tail -n 100
          kubectl get pods -A --no-headers | grep -v -E ' (Running|Completed) ' || true
          kubectl get pods -A --no-headers | grep -v -E ' (Running|Completed) ' | while read -r namespace pod _; do
            kubectl -n "$namespace" describe pod "$pod" | sed -n '/^Events:/,$p'
          done
          for namespace in synaplan opendesk; do
            kubectl -n "$namespace" logs deployment/synaplan --all-containers --tail=200 2>/dev/null || true
          done

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ inputs.environment }}${{ inputs.opendesk-ref && format('-{0}', inputs.opendesk-ref) || '' }}
          path: e2e/playwright-report
          retention-days: 7
